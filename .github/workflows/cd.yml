name: CD - Docker Build and Push

on:
  push:
    branches:
      - main
      - 'devops/**'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          docker build \
            -t ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest \
            .

      - name: Push Docker image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          docker push ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest 

