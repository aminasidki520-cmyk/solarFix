name: CD - Build, Push and Deploy

on:
  push:
    branches:
      - main
      - 'devops/**'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          docker build \
            -t ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest \
            .

      - name: Push Docker image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          docker push \
            ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${{ github.sha }}

          docker push \
            ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest


  deploy:
    name: Deploy to Production Server
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${SERVER_USER}@${SERVER_HOST} \
            "export GHCR_USERNAME='${GHCR_USERNAME}' \
             GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' \
             IMAGE_TAG='${IMAGE_TAG}' && \
             cd ~/solarFix && \
             echo \"\$GHCR_READ_TOKEN\" | docker login ghcr.io \
               -u \"\$GHCR_USERNAME\" \
               --password-stdin && \
             docker compose pull && \
             docker compose up -d && \
             docker image prune -f"
