name: CI

on:
  push:
    branches:
      - main
      - 'devops/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
        distribution: temurin
        java-version: '21'
        cache: maven
      - name: Run tests
        run: ./mvnw test
      - name: Verify Java
        run: |
          java -version
          ./mvnw -version
      - name: Build application
        run: ./mvnw package -DskipTests

