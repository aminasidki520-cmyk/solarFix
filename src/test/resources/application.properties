# Configuration des tests - utilise H2 en mémoire pour éviter la dépendance à PostgreSQL
spring.application.name=SolarTech-Test
server.port=8083

# Base de données H2 en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Désactiver Liquibase pour les tests (H2 crée le schéma automatiquement)
spring.liquibase.enabled=false

# H2 console (optionnel pour déboguer les tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=test-secret-key-for-junit-tests-only-please-change-this-to-a-long-random-value
jwt.expiration=86400000
